<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>Desktop Buddy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bubble" id="bubble">
      <div class="bubble-text" id="bubbleText" dir="auto"></div>
      <div class="bubble-buttons" id="bubbleButtons"></div>
    </div>

    <div class="stage">
      <div class="buddy" id="buddy">
        <span class="face" id="face"></span>
        <span class="extra" id="extra"></span>
      </div>
    </div>

    <script src="buddy.js"></script>
    <script src="bubble.js"></script>
  </body>
</html>
